    // FS proxy: 代理 iframe 的文件系统请求到 electronAPI
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.__fs_request) return;
      var req = e.data;
      var api = window.electronAPI && window.electronAPI.fs;
      if (!api) { e.source.postMessage({ __fs_response: req.id, result: { error: 'electronAPI not ready' } }, '*'); return; }
      var method = api[req.method];
      if (!method) { e.source.postMessage({ __fs_response: req.id, result: { error: 'Unknown method: ' + req.method } }, '*'); return; }
      Promise.resolve().then(function() { return method.apply(api, req.args || []); }).then(function(r) {
        e.source.postMessage({ __fs_response: req.id, result: r }, '*');
      }).catch(function(err) {
        e.source.postMessage({ __fs_response: req.id, result: { error: err.message } }, '*');
      });
    });
